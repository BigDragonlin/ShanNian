name: 构建 macOS 应用

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: 构建闪念.app
    runs-on: macos-14

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 验证 Markdown 写入功能
        run: swift run VerifyShanNian

      - name: 构建 Mac 应用
        run: ./build-app.sh

      - name: 制作 DMG 安装镜像
        run: ./scripts/create-dmg.sh

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: ShanNian-macOS-DMG
          path: outputs/ShanNian-macOS.dmg
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: 发布 DMG 到 GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: 下载已经构建好的 DMG
        uses: actions/download-artifact@v4
        with:
          name: ShanNian-macOS-DMG
          path: release

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "release/ShanNian-macOS.dmg"
          --title "闪念 ${GITHUB_REF_NAME}"
          --generate-notes
